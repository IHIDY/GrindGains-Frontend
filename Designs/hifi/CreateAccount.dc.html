<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #2E6B42; text-decoration: none; }
    a:hover { color: #3E8352; }
    input::placeholder { color: #9A8F7C; }
  </style>
</helmet>

<div style="position:relative; width:1440px; height:900px; overflow:hidden; background:#FDF6EA; font-family:'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif; display:flex; align-items:center; justify-content:center;">

  <div style="position:relative; width:440px; display:flex; flex-direction:column; gap:28px; background:#FFFFFF; border:1px solid #C9BDA6; border-radius:20px; padding:44px 40px 40px; box-shadow:0 20px 48px rgba(74,68,56,0.10);">

    <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="9" width="3" height="6" rx="1" fill="#2E6B42"/>
          <rect x="19" y="9" width="3" height="6" rx="1" fill="#2E6B42"/>
          <rect x="5" y="7" width="2.5" height="10" rx="1" fill="#6F9445"/>
          <rect x="16.5" y="7" width="2.5" height="10" rx="1" fill="#6F9445"/>
          <rect x="7.5" y="11" width="9" height="2" rx="1" fill="#7D7261"/>
        </svg>
        <div style="font-weight:700; font-size:22px; color:#2E6B42;">GrindGains</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;">
        <div style="font-size:22px; font-weight:600; color:#4A4438;">Create your account</div>
        <div style="font-size:14px; color:#7D7261;">You'll need an invite code to sign up.</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:13px; font-weight:500; color:#7D7261;">Email</label>
        <input type="text" placeholder="you@example.com" style="background:#FDF6EA; border:1px solid #C9BDA6; border-radius:10px; padding:12px 16px; color:#4A4438; font-size:15px; font-family:inherit; outline:none;">
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:13px; font-weight:500; color:#7D7261;">Password</label>
        <input type="password" value="········" style="background:#FDF6EA; border:1px solid #C9BDA6; border-radius:10px; padding:12px 16px; color:#4A4438; font-size:15px; font-family:inherit; outline:none;">
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:13px; font-weight:500; color:#7D7261;">Confirm password</label>
        <input type="password" value="········" style="background:#FDF6EA; border:1px solid #C9BDA6; border-radius:10px; padding:12px 16px; color:#4A4438; font-size:15px; font-family:inherit; outline:none;">
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <label style="font-size:13px; font-weight:500; color:#7D7261;">Invite code</label>
        <input type="text" placeholder="e.g. FALCON-2C9X" style="background:#FDF6EA; border:1px solid #C9BDA6; border-radius:10px; padding:12px 16px; color:#4A4438; font-size:15px; font-family:inherit; outline:none; letter-spacing:0.04em;">
        <div style="font-size:12px; color:#9A8F7C;">Don't have one? Ask whoever invited you.</div>
      </div>
    </div>

    <button style="background:#2E6B42; color:#ffffff; border:none; border-radius:10px; padding:13px 20px; font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;">Create Account</button>

    <div style="text-align:center; font-size:14px; color:#7D7261;">
      Already have an account? <a href="#" style="font-weight:600;">Log in</a>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
